<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduFuture - Welcome</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F2F4F8;
            -webkit-tap-highlight-color: transparent;
            /* UX Mobile: Cho phép cuộn khi bàn phím hiện lên, nhưng ẩn thanh cuộn để đẹp hơn */
            min-height: 100vh;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Error Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        /* Glass Components */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        /* Input Styling */
        .glass-input-wrapper {
            position: relative;
            transition: all 0.3s;
        }
        .glass-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 16px 16px 16px 48px;
            border-radius: 16px;
            /* UX Mobile: Font 16px ngăn iOS tự động zoom */
            font-size: 16px; 
            font-weight: 500;
            color: #1e293b;
            outline: none;
            transition: all 0.3s;
        }
        .glass-input::placeholder { color: #94a3b8; font-weight: 400; font-size: 15px; }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        /* Error State for Input */
        .glass-input.error {
            border-color: #ef4444;
            background: rgba(254, 242, 242, 0.5);
        }
        .glass-input.error:focus {
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            transition: color 0.3s;
            pointer-events: none; /* Cho phép click xuyên qua icon vào input */
        }
        .glass-input:focus ~ .input-icon { color: #8b5cf6; }

        /* Primary Button */
        .btn-primary {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(30, 41, 59, 0.3);
            transition: all 0.3s;
            /* UX: Tránh dính double-tap zoom */
            touch-action: manipulation; 
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:hover { box-shadow: 0 15px 30px -5px rgba(30, 41, 59, 0.4); transform: translateY(-1px); }

        /* Social Button */
        .btn-social {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.2s;
        }
        .btn-social:hover { background: rgba(255, 255, 255, 0.9); transform: scale(1.05); }
        .btn-social:active { transform: scale(0.95); background: rgba(255,255,255,0.7); }

        /* Switcher Tabs */
        .auth-switcher {
            background: rgba(203, 213, 225, 0.2);
            padding: 4px;
            border-radius: 16px;
            display: flex;
            position: relative;
        }
        .switcher-btn {
            flex: 1;
            padding: 12px; /* Tăng vùng chạm */
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
            border-radius: 12px;
            position: relative;
            z-index: 2;
            transition: color 0.3s;
        }
        .switcher-btn.active { color: #1e293b; }
        .switcher-bg {
            position: absolute;
            top: 4px; bottom: 4px; left: 4px;
            width: calc(50% - 4px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1;
        }

        /* Form Transition */
        .form-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .hidden-form {
            display: none;
            opacity: 0;
            transform: translateX(20px);
        }
        .active-form {
            display: block;
            opacity: 1;
            transform: translateX(0);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

    </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4 sm:p-6 lg:p-8">

    <!-- Dynamic Background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[70%] h-[60%] bg-blue-200/40 rounded-full blur-[80px] mix-blend-multiply animate-blob"></div>
        <div class="absolute top-[20%] right-[-20%] w-[70%] h-[60%] bg-violet-200/40 rounded-full blur-[80px] mix-blend-multiply animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-10%] left-[20%] w-[70%] h-[60%] bg-fuchsia-200/40 rounded-full blur-[80px] mix-blend-multiply animate-blob animation-delay-4000"></div>
    </div>

    <!-- Main Card - Tăng max-width để thoáng hơn trên tablet, responsive tốt hơn -->
    <div class="glass-card w-full max-w-[420px] rounded-[2.5rem] p-6 sm:p-8 relative z-10 animate-fade-in-up my-auto">
        
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 shadow-lg shadow-violet-500/30 mb-4">
                <i data-lucide="zap" class="text-white fill-current w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Edu<span class="text-violet-600">Future</span></h1>
            <p class="text-slate-500 text-sm mt-1 font-medium">Học tập không giới hạn</p>
        </div>

        <!-- Switcher -->
        <div class="auth-switcher mb-8">
            <div class="switcher-bg" id="switcher-bg"></div>
            <button class="switcher-btn active" onclick="switchAuth('login', this)">Đăng nhập</button>
            <button class="switcher-btn" onclick="switchAuth('register', this)">Đăng ký</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form" class="active-form form-container space-y-5">
            <div class="glass-input-wrapper group">
                <input type="email" id="login-email" placeholder="Email của bạn" class="glass-input" inputmode="email">
                <i data-lucide="mail" class="input-icon w-5 h-5"></i>
            </div>
            
            <div class="glass-input-wrapper group">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="glass-input">
                <i data-lucide="lock" class="input-icon w-5 h-5"></i>
                <!-- UX: Toggle Password Visibility -->
                <button onclick="togglePassword('login-pass', this)" class="absolute right-0 top-0 h-full px-4 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center" type="button">
                    <i data-lucide="eye" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex justify-end">
                <!-- UX: Tăng vùng chạm (padding) cho link nhỏ -->
                <a href="#" class="text-xs font-bold text-violet-600 hover:text-violet-700 py-2 px-1 -mr-1">Quên mật khẩu?</a>
            </div>

            <button class="btn-primary w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2" onclick="handleLogin()">
                Đăng nhập <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" class="hidden-form form-container space-y-5">
            <div class="glass-input-wrapper">
                <input type="text" placeholder="Họ và tên" class="glass-input" autocapitalize="words">
                <i data-lucide="user" class="input-icon w-5 h-5"></i>
            </div>

            <div class="glass-input-wrapper">
                <input type="email" placeholder="Email" class="glass-input" inputmode="email">
                <i data-lucide="mail" class="input-icon w-5 h-5"></i>
            </div>
            
            <div class="glass-input-wrapper">
                <input type="password" placeholder="Tạo mật khẩu" class="glass-input">
                <i data-lucide="lock" class="input-icon w-5 h-5"></i>
            </div>

            <div class="glass-input-wrapper">
                <input type="password" placeholder="Nhập lại mật khẩu" class="glass-input">
                <i data-lucide="check-circle" class="input-icon w-5 h-5"></i>
            </div>

            <button class="btn-primary w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2">
                Tạo tài khoản
            </button>
        </div>

        <!-- Social Login -->
        <div class="mt-8 text-center">
            <div class="relative mb-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-300/50"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="bg-white/60 backdrop-blur-sm px-4 text-slate-500 font-bold rounded-full">Hoặc tiếp tục với</span>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <button class="btn-social w-14 h-14 rounded-full flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="w-6 h-6">
                </button>
                <button class="btn-social w-14 h-14 rounded-full flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" class="w-6 h-6">
                </button>
                <button class="btn-social w-14 h-14 rounded-full flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" alt="Facebook" class="w-6 h-6">
                </button>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-[11px] text-slate-400 mt-8 font-medium leading-relaxed">
            Bằng cách tiếp tục, bạn đồng ý với <a href="#" class="text-slate-600 underline px-1">Điều khoản</a> & <a href="#" class="text-slate-600 underline px-1">Chính sách bảo mật</a>
        </p>

    </div>

    <script>
        lucide.createIcons();

        function switchAuth(mode, btn) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const bg = document.getElementById('switcher-bg');
            const btns = document.querySelectorAll('.switcher-btn');

            // Update Tabs
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Clear errors when switching
            document.querySelectorAll('.glass-input').forEach(el => el.classList.remove('error'));

            // Move Background Indicator
            if (mode === 'login') {
                bg.style.transform = 'translateX(0)';
                
                // Show Login
                registerForm.classList.remove('active-form');
                registerForm.classList.add('hidden-form');
                setTimeout(() => {
                    loginForm.classList.remove('hidden-form');
                    loginForm.classList.add('active-form');
                }, 100);
            } else {
                bg.style.transform = 'translateX(100%)';
                
                // Show Register
                loginForm.classList.remove('active-form');
                loginForm.classList.add('hidden-form');
                setTimeout(() => {
                    registerForm.classList.remove('hidden-form');
                    registerForm.classList.add('active-form');
                }, 100);
            }
        }

        // UX Feature: Toggle Password
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('svg');
            
            if (input.type === "password") {
                input.type = "text";
                // Change icon to eye-off (using lucide replace logic roughly)
                btn.innerHTML = '<i data-lucide="eye-off" class="w-5 h-5"></i>';
                btn.classList.add('text-violet-600');
            } else {
                input.type = "password";
                btn.innerHTML = '<i data-lucide="eye" class="w-5 h-5"></i>';
                btn.classList.remove('text-violet-600');
            }
            lucide.createIcons();
        }

        function handleLogin() {
            const btn = document.querySelector('.btn-primary');
            const originalContent = btn.innerHTML;
            const emailInput = document.getElementById('login-email');
            const passInput = document.getElementById('login-pass');
            let isValid = true;

            // Simple Mock Validation
            if (!emailInput.value) {
                emailInput.classList.add('error');
                emailInput.parentElement.classList.add('shake');
                isValid = false;
            }
            if (!passInput.value) {
                passInput.classList.add('error');
                passInput.parentElement.classList.add('shake');
                isValid = false;
            }

            // Remove shake class after animation
            setTimeout(() => {
                document.querySelectorAll('.shake').forEach(el => el.classList.remove('shake'));
            }, 300);

            // Remove error class on focus
            [emailInput, passInput].forEach(inp => {
                inp.addEventListener('focus', () => inp.classList.remove('error'));
            });

            if (!isValid) return;
            
            // Loading State
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
            btn.disabled = true;
            lucide.createIcons();
            
            setTimeout(() => {
                btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i> Thành công';
                btn.classList.remove('btn-primary');
                btn.classList.add('bg-green-500', 'text-white');
                
                setTimeout(() => {
                    // Reset for demo purposes
                    btn.innerHTML = originalContent;
                    btn.classList.add('btn-primary');
                    btn.classList.remove('bg-green-500', 'text-white');
                    btn.disabled = false;
                    lucide.createIcons();
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
