<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduFuture - Chứng chỉ của tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
        .animate-blob { animation: blob 7s infinite; } .animation-delay-2000 { animation-delay: 2s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); border-bottom: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03); border-bottom-left-radius: 2rem; border-bottom-right-radius: 2rem;}
        .glass-header::after { content: ''; position: absolute; bottom: -1px; left: 15%; right: 15%; height: 2px; background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.6), transparent); border-radius: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-10 overflow-x-hidden relative min-h-screen">
<div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute top-[-10%] right-[-10%] w-[70%] h-[50%] bg-amber-200/40 rounded-full blur-[80px] mix-blend-multiply animate-blob"></div>
    <div class="absolute top-[30%] left-[-20%] w-[70%] h-[50%] bg-violet-200/40 rounded-full blur-[80px] mix-blend-multiply animate-blob animation-delay-2000"></div>
</div>

<div class="max-w-md mx-auto w-full relative z-10 flex flex-col">
    <!-- Header -->
    <header class="fixed top-0 w-full max-w-md z-50 transition-all duration-300 glass-header flex justify-between items-center py-3 px-4">
        <button class="w-10 h-10 rounded-full bg-slate-100/80 flex items-center justify-center text-slate-700 shadow-sm active:scale-95 transition-transform" onclick="window.history.back()">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-base font-bold text-slate-800">Chứng chỉ (3)</h1>
        <div class="w-10 h-10"></div>
    </header>

    <main class="pt-[90px] px-4 space-y-4">
        <!-- Certificate Card 1 -->
        <section class="glass-panel rounded-[1.5rem] p-5 relative overflow-hidden animate-slide-up">
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-amber-300 rounded-full blur-2xl opacity-30"></div>
            <div class="flex items-start gap-4 relative z-10">
                <div class="w-14 h-14 rounded-[12px] bg-gradient-to-br from-amber-100 to-yellow-50 border border-amber-200 flex items-center justify-center shrink-0 shadow-sm">
                    <i data-lucide="award" class="text-amber-500 w-7 h-7"></i>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-slate-800 text-sm leading-tight">UI/UX Design Masterclass</h3>
                    <p class="text-[10px] text-slate-500 mt-1 font-medium">Cấp ngày: 20/05/2026</p>
                    <span class="inline-block mt-2 text-[10px] font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full border border-amber-200">Xuất sắc (98/100)</span>
                </div>
            </div>
            <div class="flex gap-2 mt-5 relative z-10">
                <button class="flex-1 py-2.5 text-xs font-bold text-slate-700 bg-white border border-slate-200 rounded-xl active:scale-95 transition-transform flex justify-center items-center gap-1.5 shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i> Tải PDF
                </button>
                <button class="flex-1 py-2.5 text-xs font-bold text-white bg-[#0A66C2] rounded-xl active:scale-95 transition-transform flex justify-center items-center gap-1.5 shadow-md shadow-blue-500/20">
                    <i data-lucide="linkedin" class="w-4 h-4"></i> Thêm vào hồ sơ
                </button>
            </div>
        </section>

        <!-- Certificate Card 2 -->
        <section class="glass-panel rounded-[1.5rem] p-5 relative overflow-hidden animate-slide-up" style="animation-delay: 0.1s;">
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-blue-300 rounded-full blur-2xl opacity-20"></div>
            <div class="flex items-start gap-4 relative z-10">
                <div class="w-14 h-14 rounded-[12px] bg-gradient-to-br from-slate-100 to-white border border-slate-200 flex items-center justify-center shrink-0 shadow-sm">
                    <i data-lucide="award" class="text-slate-500 w-7 h-7"></i>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-slate-800 text-sm leading-tight">Lập trình Web Frontend Cơ bản</h3>
                    <p class="text-[10px] text-slate-500 mt-1 font-medium">Cấp ngày: 15/02/2026</p>
                    <span class="inline-block mt-2 text-[10px] font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200">Khá (85/100)</span>
                </div>
            </div>
            <div class="flex gap-2 mt-5 relative z-10">
                <button class="w-full py-2.5 text-xs font-bold text-slate-700 bg-white border border-slate-200 rounded-xl active:scale-95 transition-transform flex justify-center items-center gap-1.5 shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i> Tải chứng chỉ (PDF)
                </button>
            </div>
        </section>
    </main>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
