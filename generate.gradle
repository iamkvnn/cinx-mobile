import java.io.File
import groovy.json.JsonSlurper

task generateApi {
    doLast {
        println("Generating APIs from JSON using Groovy...")
        def baseDir = project.projectDir
        def assetsDir = new File(baseDir, "src/main/assets")
        def apiDir = new File(baseDir, "src/main/java/com/app/cinx/api")
        def dtoDir = new File(baseDir, "src/main/java/com/app/cinx/api/dto")
        
        apiDir.mkdirs()
        dtoDir.mkdirs()
        
        def jsonSlurper = new groovy.json.JsonSlurper()
        
        def files = assetsDir.listFiles()
        if (files == null) {
            println("No files found in ${assetsDir.absolutePath}")
            return
        }
        files.findAll { it.name.endsWith('.json') }.each { file ->
            println("Processing ${file.name}")
            def root = jsonSlurper.parseText(file.text)
            
            def resolveType = { prop ->
                if(prop.'$ref') {
                    return prop.'$ref'.split('/').last()
                }
                if(prop.type) {
                    if(prop.type == 'string') return 'String'
                    if(prop.type == 'integer') return (prop.format == 'int64' ? 'Long' : 'Integer')
                    if(prop.type == 'number') return 'Double'
                    if(prop.type == 'boolean') return 'Boolean'
                    if(prop.type == 'array') {
                        if(prop.items) {
                            def itemType = (prop.items.'$ref') ? prop.items.'$ref'.split('/').last() : 'Object'
                            if(prop.items.type == 'string') itemType = 'String'
                            if(prop.items.type == 'integer') itemType = 'Integer'
                            return "List<${itemType}>"
                        }
                        return "List<Object>"
                    }
                }
                return 'Object'
            }

            if(root.components?.schemas) {
                root.components.schemas.each { schemaName, schema ->
                    if(schemaName.startsWith("ApiResponse") || schemaName.startsWith("ApiListResponse") || schemaName == "PageMeta" || schemaName == "ApiResponseObject") return
                    
                    def sb = new StringBuilder()
                    sb.append("package com.app.cinx.api.dto;\n\n")
                    sb.append("import java.util.List;\n\n")
                    sb.append("public class ${schemaName} {\n")
                    
                    if(schema.properties) {
                        schema.properties.each { propName, prop ->
                            def jType = resolveType(prop)
                            sb.append("    private ${jType} ${propName};\n")
                            def cName = propName.capitalize()
                            sb.append("    public ${jType} get${cName}() { return ${propName}; }\n")
                            sb.append("    public void set${cName}(${jType} val) { this.${propName} = val; }\n\n")
                        }
                    }
                    sb.append("    // mock field preserved for ui consistency\n")
                    sb.append("}\n")
                    
                    new File(dtoDir, "${schemaName}.java").text = sb.toString()
                }
            }
            
            if(root.paths) {
                String apiName = file.name.replace(".json", "").capitalize() + "Service"
                def sb = new StringBuilder()
                sb.append("package com.app.cinx.api;\n\n")
                sb.append("import com.app.cinx.api.dto.*;\n")
                sb.append("import retrofit2.Call;\n")
                sb.append("import retrofit2.http.*;\n")
                sb.append("import java.util.List;\n\n")
                sb.append("public interface ${apiName} {\n")
                
                root.paths.each { pathName, ops ->
                    ops.each { method, op ->
                        def methodName = op.operationId ?: "do" + method.capitalize()
                        def retType = "Object"
                        
                        if(op.responses?.get("200")?.content?.get("*/*")?.schema) {
                            retType = resolveType(op.responses.get("200").content.get("*/*").schema)
                        } else if(op.responses?.get("200")?.content?.get("application/json")?.schema) {
                            retType = resolveType(op.responses.get("200").content.get("application/json").schema)
                        }
                        
                        if(retType.startsWith("ApiResponse")) {
                            def sub = retType.replace("ApiResponse", "")
                            if(!sub || sub == "Object") sub = "Object"
                            if(sub == "TokenResponseDto") sub = "TokenResponseDto"
                            retType = "ApiResponse<${sub}>"
                        } else if(retType.startsWith("ApiListResponse")) {
                            def sub = retType.replace("ApiListResponse", "")
                            retType = "ApiListResponse<${sub}>"
                        }
                        
                        sb.append("    @${method.toUpperCase()}(\"${pathName.substring(1)}\")\n")
                        sb.append("    Call<${retType}> ${methodName}(")
                        
                        def paramsList = []
                        if(op.parameters) {
                            op.parameters.each { p ->
                                def pIn = p.in
                                def pName = p.name
                                def pType = p.schema ? resolveType(p.schema) : "String"
                                if(pIn == 'query') paramsList.add("@Query(\"${pName}\") ${pType} ${pName}")
                                if(pIn == 'path') paramsList.add("@Path(\"${pName}\") ${pType} ${pName}")
                            }
                        }
                        if(op.requestBody?.content?.get("application/json")?.schema) {
                            def bodyType = resolveType(op.requestBody.content.get("application/json").schema)
                            paramsList.add("@Body ${bodyType} body")
                        }
                        
                        sb.append(paramsList.join(", "))
                        sb.append(");\n\n")
                    }
                }
                
                sb.append("}\n")
                new File(apiDir, "${apiName}.java").text = sb.toString()
            }
        }
        println("Code generated successfully.")
    }
}
